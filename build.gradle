import java.security.MessageDigest
import java.util.jar.JarEntry
import java.util.jar.JarFile
import java.util.jar.JarOutputStream

plugins {
    id "net.fabricmc.fabric-loom" version "1.17.21"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // Minecraft 26.2 ships unobfuscated, so these dependencies use implementation.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = "UTF-8"
}

// Caustica is an independently licensed LGPL Fabric mod which supplies the actual
// Vulkan hardware ray-tracing renderer. Package it as a Fabric nested mod rather
// than copying its classes into QuantumTrace. The release checksum pins the exact
// upstream binary we build against.
def causticaVersion = "0.1.1"
def causticaSha256 = "785b4b3b28a9b13e30a28e846a73050b87b4009af28125e3a262cd3365afdef0"
def causticaUrl = "https://github.com/ComfyFluffy/Caustica/releases/download/${causticaVersion}/caustica-${causticaVersion}.jar"
def causticaDownload = layout.buildDirectory.file("downloads/caustica-${causticaVersion}-upstream.jar")
def nestedResources = layout.buildDirectory.dir("generated/quantumtrace-nested-resources")
def nestedCausticaJar = nestedResources.map { it.file("META-INF/jars/caustica-${causticaVersion}.jar") }

def sha256Of = { File file ->
    MessageDigest.getInstance("SHA-256").digest(file.bytes)
            .collect { String.format("%02x", it & 0xff) }.join()
}

tasks.register("prepareCausticaNestedMod") {
    group = "build"
    description = "Downloads, verifies, and nests the LGPL Caustica hardware ray-tracing engine."
    outputs.file(nestedCausticaJar)

    doLast {
        File upstream = causticaDownload.get().asFile
        if (!upstream.exists() || sha256Of(upstream) != causticaSha256) {
            upstream.parentFile.mkdirs()
            upstream.delete()
            URLConnection connection = new URL(causticaUrl).openConnection()
            connection.connectTimeout = 15000
            connection.readTimeout = 180000
            connection.setRequestProperty("User-Agent", "QuantumTrace-build")
            connection.getInputStream().withCloseable { input ->
                upstream.withOutputStream { output -> input.transferTo(output) }
            }
        }

        String downloadedHash = sha256Of(upstream)
        if (downloadedHash != causticaSha256) {
            upstream.delete()
            throw new GradleException("Caustica ${causticaVersion} checksum mismatch: ${downloadedHash}")
        }

        File nested = nestedCausticaJar.get().asFile
        nested.parentFile.mkdirs()
        nested.delete()

        // The upstream jar can contain optional NVIDIA NGX binaries. Those are
        // proprietary SDK components under a separate NVIDIA license, not needed
        // for Vulkan ray tracing itself, so they are deliberately not redistributed.
        new JarFile(upstream).withCloseable { source ->
            new JarOutputStream(new BufferedOutputStream(new FileOutputStream(nested))).withCloseable { output ->
                def entries = source.entries()
                while (entries.hasMoreElements()) {
                    JarEntry entry = entries.nextElement()
                    String baseName = entry.name.substring(entry.name.lastIndexOf('/') + 1).toLowerCase(Locale.ROOT)
                    boolean nvidiaSdkBinary = baseName.startsWith("nvngx_") || baseName.startsWith("libnvidia-ngx-")
                    if (!nvidiaSdkBinary) {
                        JarEntry copy = new JarEntry(entry.name)
                        if (entry.time >= 0L) copy.time = entry.time
                        output.putNextEntry(copy)
                        if (!entry.directory) {
                            source.getInputStream(entry).withCloseable { input -> input.transferTo(output) }
                        }
                        output.closeEntry()
                    } else {
                        logger.lifecycle("Omitting separately licensed NVIDIA NGX runtime: ${entry.name}")
                    }
                }
            }
        }

        // Fail the build rather than silently shipping a settings-only QuantumTrace jar.
        new JarFile(nested).withCloseable { jar ->
            List<String> names = []
            def iterator = jar.entries()
            while (iterator.hasMoreElements()) {
                names.add(iterator.nextElement().name)
            }

            boolean hasModMetadata = names.contains("fabric.mod.json")
            boolean hasMixinMetadata = names.any { it.endsWith("caustica.mixins.json") }
            boolean hasRaygenShader = names.any { it.endsWith("world.rgen.spv") }
            if (!hasModMetadata || !hasMixinMetadata || !hasRaygenShader) {
                def diagnosticEntries = names.findAll {
                    it.toLowerCase(Locale.ROOT).contains("fabric.mod")
                            || it.toLowerCase(Locale.ROOT).contains("mixins")
                            || it.toLowerCase(Locale.ROOT).endsWith(".spv")
                            || it.toLowerCase(Locale.ROOT).contains("primary.rgen")
                }.take(100)
                throw new GradleException("Bundled Caustica validation failed: fabric.mod.json=${hasModMetadata}, " +
                        "caustica.mixins.json=${hasMixinMetadata}, primary.rgen.spv=${hasRaygenShader}; " +
                        "matching entries: ${diagnosticEntries}")
            }

            if (names.any { name ->
                String baseName = name.substring(name.lastIndexOf('/') + 1).toLowerCase(Locale.ROOT)
                baseName.startsWith("nvngx_") || baseName.startsWith("libnvidia-ngx-")
            }) {
                throw new GradleException("A proprietary NVIDIA NGX native library was not removed from the nested jar")
            }
        }

        logger.lifecycle("Prepared Caustica ${causticaVersion} nested mod (${nested.length()} bytes; no NVIDIA NGX binaries).")
    }
}

sourceSets.main.resources.srcDir(nestedResources)

tasks.named("processResources").configure {
    dependsOn(tasks.named("prepareCausticaNestedMod"))
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}
