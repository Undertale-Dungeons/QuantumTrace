name: Build QuantumTrace

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Build mod
        run: gradle --no-daemon clean build

      - name: Verify bundled hardware ray tracing runtime
        shell: bash
        run: |
          set -euo pipefail
          mod_jar="$(find build/libs -maxdepth 1 -name 'quantumtrace-*.jar' ! -name '*-sources.jar' -print -quit)"
          test -n "$mod_jar"
          unzip -p "$mod_jar" META-INF/jars/caustica-0.1.1.jar > "$RUNNER_TEMP/caustica.jar"
          jar tf "$RUNNER_TEMP/caustica.jar" | grep -Fxq 'caustica/rt/world.rgen.spv'
          if jar tf "$RUNNER_TEMP/caustica.jar" | grep -Eiq '(^|/)(nvngx_|libnvidia-ngx-)'; then
            echo "Unexpected proprietary NVIDIA NGX binary in distributable"
            exit 1
          fi
          echo "Verified bundled Vulkan path-tracing engine and shader payload"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: QuantumTrace-Fabric-26.2
          path: build/libs/quantumtrace-*.jar
          if-no-files-found: error
          retention-days: 14
